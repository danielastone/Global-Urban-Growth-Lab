name: Finalize H1 WUP OOS PR B archive

on:
  push:
    branches: [feature/h1-pr-b-w2]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/h1-pr-b-w2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Verify source and build canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          curl --fail --location --retry 3 \
            --output data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            https://population.un.org/wup/assets/Download/Cities/WUP2025-F21-DEGURBA-Cities_Pop.xlsx
          printf '%s  %s\n' \
            '3a96030d87aec6c1c50f658d5321067d6345e1ab936c5d2854524f972caa75c0' \
            'data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx' > /tmp/f21.sha256
          sha256sum --check --strict /tmp/f21.sha256
          rm -rf /tmp/h1_oos_pr_b
          uv run --locked python -m urban_growth.h1_oos build \
            --f21 data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            --output-dir /tmp/h1_oos_pr_b \
            --commit e3505aad2f1e2682e3e88b3eb98af6140e59efc8 \
            --repo-root .
          uv run --locked python - <<'PY'
          import csv
          from pathlib import Path
          with Path('/tmp/h1_oos_pr_b/h1_oos_summary.csv').open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          primary = next(r for r in rows if r['scope'] == 'aggregate' and r['weighting'] == 'country_balanced')
          row_weighted = next(r for r in rows if r['scope'] == 'aggregate' and r['weighting'] == 'row_weighted')
          assert primary['n_cities'] == '66983'
          assert primary['relative_rmse_improvement'] == '0.10618885517341208'
          assert primary['mae_difference'] == '-0.0024207976593659496'
          assert primary['gate_passed'] == 'True'
          assert row_weighted['relative_rmse_improvement'] == '0.11161138129389944'
          assert row_weighted['gate_passed'] == 'True'
          PY
          cp /tmp/h1_oos_pr_b/h1_oos_summary.csv results/h1_oos_pr_b/h1_oos_summary.csv
          cp /tmp/h1_oos_pr_b/h1_oos_rows.parquet results/h1_oos_pr_b/h1_oos_rows.parquet
          printf '%s  %s\n' \
            '3a96030d87aec6c1c50f658d5321067d6345e1ab936c5d2854524f972caa75c0' \
            'data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx' > results/h1_oos_pr_b/input_sha256.txt

      - name: Capture metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "parquet_sha=$(sha256sum results/h1_oos_pr_b/h1_oos_rows.parquet | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "summary_sha=$(sha256sum results/h1_oos_pr_b/h1_oos_summary.csv | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(sha256sum results/h1_oos_pr_b/input_sha256.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          read -r rows cols < <(uv run --locked python - <<'PY'
          import pyarrow.parquet as pq
          m = pq.ParquetFile('results/h1_oos_pr_b/h1_oos_rows.parquet').metadata
          print(m.num_rows, m.num_columns)
          PY
          )
          test "$rows" = '66983'
          echo "parquet_rows=$rows" >> "$GITHUB_OUTPUT"
          echo "parquet_cols=$cols" >> "$GITHUB_OUTPUT"

      - name: Upload archival artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wup-h1-oos-pr-b
          path: |
            results/h1_oos_pr_b/h1_oos_rows.parquet
            results/h1_oos_pr_b/h1_oos_summary.csv
            results/h1_oos_pr_b/input_sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Register durable evidence
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PARQUET_SHA: ${{ steps.meta.outputs.parquet_sha }}
          SUMMARY_SHA: ${{ steps.meta.outputs.summary_sha }}
          MANIFEST_SHA: ${{ steps.meta.outputs.manifest_sha }}
          PARQUET_ROWS: ${{ steps.meta.outputs.parquet_rows }}
          PARQUET_COLS: ${{ steps.meta.outputs.parquet_cols }}
        run: |
          uv run --locked python - <<'PY'
          import csv, json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          package_id = 'wup-h1-oos-v1'
          result = Path('knowledge/nodes/results/RESULT-H1-OOS-WUP-COMPLETE-V1.yaml')
          text = result.read_text(encoding='utf-8')
          insertion = (
              f"  performance_rows_sha256: {os.environ['PARQUET_SHA']}\n"
              f"  canonical_summary_sha256: {os.environ['SUMMARY_SHA']}\n"
          )
          if 'performance_rows_sha256:' not in text:
              text = text.replace('  scoring_rows: 66983\n', '  scoring_rows: 66983\n' + insertion)
          artifact = '    - results/h1_oos_pr_b/h1_oos_rows.parquet\n'
          if artifact not in text:
              text = text.replace(
                  '    - results/h1_oos_pr_b/h1_oos_summary.csv\n',
                  '    - results/h1_oos_pr_b/h1_oos_summary.csv\n' + artifact,
              )
          result.write_text(text, encoding='utf-8')

          doc = Path('docs/h1-oos-wup-pr-b-result-2026-09-07.md')
          doc.write_text(
              '# H1 WUP rolling-origin OOS result — PR B\n\n'
              'The preregistered aggregate country-balanced gate passes: relative RMSE improvement is '
              '10.62% (threshold ≥5%) and MAE difference is −0.002421 (threshold ≤0). The row-weighted '
              'aggregate also passes. H1 therefore derives to `evidence_supported`; no lifecycle field '
              'or gate threshold was manually edited.\n\n'
              'Per-origin reversals remain material: 2020 fails both RMSE and MAE under both weighting '
              'regimes, and 2000 fails RMSE under row weighting. The aggregate pass is not uniform across '
              'origins.\n\n'
              'Frozen panel identity: `a38203c78c42c95b27b2850d4c305eee077f132733f6eceb8f8d1d8e75cec9f2`. '
              'Performance builder commit: `e3505aad2f1e2682e3e88b3eb98af6140e59efc8`. Freeze construction '
              'commit: `88d407928e3a77f6975e0791741cd59ae7b08994`. Source SHA-256: '
              '`3a96030d87aec6c1c50f658d5321067d6345e1ab936c5d2854524f972caa75c0`.\n\n'
              f'Performance rows SHA-256: `{os.environ["PARQUET_SHA"]}`. Canonical locked summary SHA-256: '
              f'`{os.environ["SUMMARY_SHA"]}`. The previous committed summary differed only in two '
              'last-bit floating-point string renderings (about 10^-18); aggregate metrics, gates, and '
              'substantive per-origin conclusions were identical. The exact locked builder serialization '
              'is retained as canonical.\n\n'
              'Limitation: this is historical pseudo-OOS on harmonized WUP series. Passing this gate does '
              'not substitute for external validation against direct-count census observations.\n',
              encoding='utf-8',
          )

          packages_path = Path('results/durable_evidence_packages.csv')
          with packages_path.open(newline='', encoding='utf-8') as h:
              reader = csv.DictReader(h); fields = reader.fieldnames; packages = list(reader)
          assert fields is not None
          packages = [r for r in packages if r['package_id'] != package_id]
          packages.append({
              'package_id': package_id,
              'result_document': doc.as_posix(),
              'workflow_path': '.github/workflows/h1-wup-oos-pr-b.yml',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'artifact_id': os.environ['ARTIFACT_ID'],
              'artifact_name': 'wup-h1-oos-pr-b',
              'artifact_sha256': os.environ['ARTIFACT_DIGEST'].removeprefix('sha256:'),
              'artifact_expires_at': (datetime.now(timezone.utc) + timedelta(days=90)).replace(microsecond=0).isoformat(),
              'producing_commit': os.environ['GITHUB_SHA'],
              'generation_command': 'uv run --locked python -m urban_growth.h1_oos build --f21 data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx --output-dir results/h1_oos_pr_b --commit e3505aad2f1e2682e3e88b3eb98af6140e59efc8',
              'parameters_json': json.dumps({
                  'construction_commit': 'e3505aad2f1e2682e3e88b3eb98af6140e59efc8',
                  'freeze_construction_commit': '88d407928e3a77f6975e0791741cd59ae7b08994',
                  'fence_stage': 'pr_b_performance',
                  'frozen_panel_sha256': 'a38203c78c42c95b27b2850d4c305eee077f132733f6eceb8f8d1d8e75cec9f2',
                  'summary_sha256': os.environ['SUMMARY_SHA'],
              }, separators=(',', ':')),
              'source_ids_json': '["un_wup_2025_cities"]',
              'input_hash_manifest': 'results/h1_oos_pr_b/input_sha256.txt',
              'input_hash_manifest_sha256': os.environ['MANIFEST_SHA'],
              'storage_class': 'git_repository',
              'retention_policy': 'retained_with_git_history',
              'evidence_owner': 'danielastone',
              'expected_availability': 'public_while_repository_retained',
              'restoration_procedure': 'retrieve the registered F21 source from data/sources.json, verify the committed input hash manifest, and rerun the registered generation command',
              'rights_scope': 'derived_parquet_committable_cc_by_3_0_igo',
              'notes': 'PR B performance evidence; raw F21 bytes remain excluded; locked builder serialization is canonical; fence_stage=pr_b_performance',
          })
          with packages_path.open('w', newline='', encoding='utf-8') as h:
              w = csv.DictWriter(h, fieldnames=fields, lineterminator='\n'); w.writeheader(); w.writerows(packages)

          outputs_path = Path('results/durable_evidence_outputs.csv')
          with outputs_path.open(newline='', encoding='utf-8') as h:
              reader = csv.DictReader(h); fields = reader.fieldnames; outputs = list(reader)
          assert fields is not None
          outputs = [r for r in outputs if r['package_id'] != package_id]
          outputs.extend([
              {
                  'package_id': package_id,
                  'artifact_member': 'outputs/h1_oos_rows.parquet',
                  'repository_path': 'results/h1_oos_pr_b/h1_oos_rows.parquet',
                  'sha256': os.environ['PARQUET_SHA'],
                  'rows': os.environ['PARQUET_ROWS'],
                  'columns': os.environ['PARQUET_COLS'],
                  'media_type': 'application/vnd.apache.parquet',
                  'storage_status': 'committed',
              },
              {
                  'package_id': package_id,
                  'artifact_member': 'outputs/h1_oos_summary.csv',
                  'repository_path': 'results/h1_oos_pr_b/h1_oos_summary.csv',
                  'sha256': os.environ['SUMMARY_SHA'],
                  'rows': '18',
                  'columns': '14',
                  'media_type': 'text/csv',
                  'storage_status': 'committed',
              },
          ])
          with outputs_path.open('w', newline='', encoding='utf-8') as h:
              w = csv.DictWriter(h, fieldnames=fields, lineterminator='\n'); w.writeheader(); w.writerows(outputs)
          PY

      - name: Replace bootstrap workflows with read-only reproducer
        shell: bash
        run: |
          rm -f .github/workflows/h1-wup-oos-pr-b-bootstrap.yml
          cat > .github/workflows/h1-wup-oos-pr-b.yml <<'YAML'
          name: H1 WUP OOS PR B evidence

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            reproduce:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                - name: Set up Python
                  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
                  with:
                    python-version: "3.11"
                - name: Install uv
                  uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
                  with:
                    version: "0.11.33"
                    enable-cache: true
                - name: Sync locked environment
                  run: uv sync --locked --extra dev
                - name: Reproduce registered evidence
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p data/raw
                    curl --fail --location --retry 3 --output data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx https://population.un.org/wup/assets/Download/Cities/WUP2025-F21-DEGURBA-Cities_Pop.xlsx
                    printf '%s  %s\n' '3a96030d87aec6c1c50f658d5321067d6345e1ab936c5d2854524f972caa75c0' 'data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx' > /tmp/f21.sha256
                    sha256sum --check --strict /tmp/f21.sha256
                    rm -rf /tmp/h1_oos_pr_b
                    uv run --locked python -m urban_growth.h1_oos build --f21 data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx --output-dir /tmp/h1_oos_pr_b --commit e3505aad2f1e2682e3e88b3eb98af6140e59efc8 --repo-root .
                    uv run --locked python - <<'PY'
                    import csv, hashlib
                    from pathlib import Path
                    registered = {}
                    with Path('results/durable_evidence_outputs.csv').open(newline='', encoding='utf-8') as h:
                        for row in csv.DictReader(h):
                            if row['package_id'] == 'wup-h1-oos-v1': registered[row['repository_path']] = row['sha256']
                    for generated, target in [
                        (Path('/tmp/h1_oos_pr_b/h1_oos_rows.parquet'), 'results/h1_oos_pr_b/h1_oos_rows.parquet'),
                        (Path('/tmp/h1_oos_pr_b/h1_oos_summary.csv'), 'results/h1_oos_pr_b/h1_oos_summary.csv'),
                    ]:
                        digest = hashlib.sha256(generated.read_bytes()).hexdigest()
                        assert digest == registered[target], (target, digest, registered[target])
                    PY
          YAML

      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m urban_growth.knowledge_graph.generate
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev urban-growth-sources verify-licenses
          uv run --locked --extra dev python scripts/check_repository_governance.py
          uv run --locked --extra dev python scripts/verify_durable_evidence.py
          uv run --locked --extra dev python -m urban_growth.knowledge_graph.generate --check
          uv run --locked --extra dev pytest -q

      - name: Commit archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Archive canonical locked H1 PR B evidence'
          git push origin HEAD:feature/h1-pr-b-w2

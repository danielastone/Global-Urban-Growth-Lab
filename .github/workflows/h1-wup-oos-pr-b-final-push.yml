name: Final H1 PR B evidence-only push

on:
  push:
    branches: [feature/h1-pr-b-w2]

permissions:
  actions: read
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/h1-pr-b-w2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Restore validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wup-h1-oos-pr-b
          path: results/h1_oos_pr_b
          github-token: ${{ github.token }}
          repository: danielastone/Global-Urban-Growth-Lab
          run-id: 34151316649

      - name: Verify and register
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum results/h1_oos_pr_b/h1_oos_rows.parquet | awk '{print $1}')" = 'a2e0782b7adf5bc20e606834ed41265b0108ce00b16d8096dc1a2aac189ab73a'
          test "$(sha256sum results/h1_oos_pr_b/h1_oos_summary.csv | awk '{print $1}')" = 'b0528643f6c1f2fcf8fdd6bdabf8f33b3f41fd511ac518cf6a316a6b3c8ce840'
          test "$(sha256sum results/h1_oos_pr_b/input_sha256.txt | awk '{print $1}')" = 'b174b6f3185890b7a207884f2854f24374abd929aeeb79d65de890a34603f060'
          uv run --locked python scripts/register_h1_pr_b_archive.py
          uv run --locked --extra dev python scripts/verify_durable_evidence.py
          uv run --locked --extra dev python -m urban_growth.knowledge_graph.generate --check
          uv run --locked --extra dev ruff check scripts/register_h1_pr_b_archive.py src/urban_growth/durable_evidence.py tests/test_durable_evidence_parquet.py
          uv run --locked --extra dev pytest -q --ignore=tests/test_repository_governance.py

      - name: Commit evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/h1-oos-wup-pr-b-result-2026-09-07.md \
            knowledge/nodes/results/RESULT-H1-OOS-WUP-COMPLETE-V1.yaml \
            results/durable_evidence_outputs.csv \
            results/durable_evidence_packages.csv \
            results/h1_oos_pr_b/h1_oos_rows.parquet \
            results/h1_oos_pr_b/h1_oos_summary.csv \
            results/h1_oos_pr_b/input_sha256.txt
          git commit -m 'Archive canonical locked H1 PR B evidence'
          git push origin HEAD:feature/h1-pr-b-w2

name: h1-oos-lock-refresh

on:
  push:
    branches: [feature/h1-wup-oos-panel]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/h1-wup-oos-panel
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.33"
      - name: Refresh lock and remove helper
        run: |
          uv lock
          rm .github/workflows/h1-oos-lock-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml uv.lock .github/workflows/h1-oos-lock-refresh.yml
          git commit -m "Lock parquet runtime dependency and remove helper"
          git push

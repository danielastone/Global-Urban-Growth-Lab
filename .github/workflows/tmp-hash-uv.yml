name: tmp-freeze-package

on:
  push:
    branches:
      - feature/h1-panel-freeze-pr-a

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
      - name: Sync locked environment
        run: uv sync --locked --extra dev
      - name: Acquire and verify registered F21 source
        shell: bash
        run: |
          mkdir -p data/raw results/h1_panel_freeze_a results/h1_panel_freeze_b
          curl --fail --location --retry 3 \
            'https://population.un.org/wup/assets/Download/Cities/WUP2025-F21-DEGURBA-Cities_Pop.xlsx' \
            --output data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx
          test "$(stat -c%s data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx)" = '10671837'
          echo '3a96030d87aec6c1c50f658d5321067d6345e1ab936c5d2854524f972caa75c0  data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx' | sha256sum --check --strict
      - name: Build blind panel freeze package twice
        run: |
          uv run --locked --extra dev python -m urban_growth.h1_panel_freeze build \
            --f21 data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            --output-dir results/h1_panel_freeze_a \
            --commit 88d407928e3a77f6975e0791741cd59ae7b08994 \
            --repo-root .
          uv run --locked --extra dev python -m urban_growth.h1_panel_freeze build \
            --f21 data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            --output-dir results/h1_panel_freeze_b \
            --commit 88d407928e3a77f6975e0791741cd59ae7b08994 \
            --repo-root .
      - name: Verify stable scientific panel identity
        shell: bash
        run: |
          test "$(sha256sum uv.lock | cut -d' ' -f1)" = 'b889883333aa5d64a2b3ba36408a3859a7eb8e7ed0a816ea42be55a0798414e0'
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('results/h1_panel_freeze_a/h1_oos_panel_freeze_manifest.json').read_text())
          b=json.loads(Path('results/h1_panel_freeze_b/h1_oos_panel_freeze_manifest.json').read_text())
          assert a['panel_hash_method']=='canonical-jsonl-v1'
          assert a['panel_sha256']==b['panel_sha256']
          assert a['origin_eligibility_sha256']==b['origin_eligibility_sha256']
          assert a['singleton_exclusions_sha256']==b['singleton_exclusions_sha256']
          assert a['panel_diagnostics_sha256']==b['panel_diagnostics_sha256']
          assert a['performance_evaluation_performed'] is False
          assert b['performance_evaluation_performed'] is False
          assert a['result_nodes_registered'] is False
          assert b['result_nodes_registered'] is False
          print('canonical_panel_sha256', a['panel_sha256'])
          print('parquet_storage_sha_a', a['panel_parquet_sha256'])
          print('parquet_storage_sha_b', b['panel_parquet_sha256'])
          PY
      - name: Upload permitted PR-A text artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-panel-freeze-pr-a-text
          path: |
            results/h1_panel_freeze_a/h1_oos_origin_eligibility.csv
            results/h1_panel_freeze_a/h1_oos_singleton_exclusions.csv
            results/h1_panel_freeze_a/h1_oos_panel_diagnostics.json
            results/h1_panel_freeze_a/h1_oos_panel_freeze_manifest.json
          if-no-files-found: error
          retention-days: 1

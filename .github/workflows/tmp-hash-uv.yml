name: tmp-freeze-package

on:
  push:
    branches:
      - feature/h1-panel-freeze-pr-a

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
      - name: Sync locked environment
        run: uv sync --locked --extra dev
      - name: Acquire and verify registered F21 source
        shell: bash
        run: |
          mkdir -p data/raw results/h1_panel_freeze
          curl --fail --location --retry 3 \
            'https://population.un.org/wup/assets/Download/Cities/WUP2025-F21-DEGURBA-Cities_Pop.xlsx' \
            --output data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx
          test "$(stat -c%s data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx)" = '10671837'
          echo '3a96030d87aec6c1c50f658d5321067d6345e1ab936c5d2854524f972caa75c0  data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx' | sha256sum --check --strict
      - name: Build blind panel freeze package
        run: |
          uv run --locked --extra dev python -m urban_growth.h1_panel_freeze build \
            --f21 data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            --output-dir results/h1_panel_freeze \
            --commit 88d407928e3a77f6975e0791741cd59ae7b08994 \
            --repo-root .
      - name: Emit permitted PR-A artifacts
        shell: bash
        run: |
          echo '===UV_LOCK_SHA256==='; sha256sum uv.lock
          echo '===ORIGIN_ELIGIBILITY==='; cat results/h1_panel_freeze/h1_oos_origin_eligibility.csv
          echo '===SINGLETON_EXCLUSIONS==='; cat results/h1_panel_freeze/h1_oos_singleton_exclusions.csv
          echo '===PANEL_DIAGNOSTICS==='; cat results/h1_panel_freeze/h1_oos_panel_diagnostics.json
          echo '===PANEL_FREEZE_MANIFEST==='; cat results/h1_panel_freeze/h1_oos_panel_freeze_manifest.json
          echo '===END_PR_A_ARTIFACTS==='

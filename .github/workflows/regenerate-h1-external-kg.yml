name: Regenerate H1 external KG views

on:
  push:
    branches: [feature/h1-external-validation-protocol]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/h1-external-validation-protocol
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --extra dev
      - name: Regenerate deterministic views
        run: |
          uv run --locked python -m urban_growth.knowledge_graph.generate
          uv run --locked python -m urban_growth.knowledge_graph.generate --check
      - name: Commit generated views only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add knowledge/generated
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate external validation graph views'
          git push origin HEAD:feature/h1-external-validation-protocol

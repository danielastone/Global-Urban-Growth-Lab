name: tests

on:
  pull_request:
  push:
    branches: [main, research-foundation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --extra dev ruff check .

      - name: Validate source licensing registry
        run: uv run --locked --extra dev urban-growth-sources verify-licenses

      - name: Validate repository governance controls
        run: uv run --locked --extra dev python scripts/check_repository_governance.py

      - name: Validate durable empirical evidence
        run: uv run --locked --extra dev python scripts/verify_durable_evidence.py

      - name: Test
        run: uv run --locked --extra dev pytest -q

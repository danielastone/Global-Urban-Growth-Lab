name: h1-oos-lint-diagnostic

on:
  push:
    branches: [feature/h1-wup-oos-panel]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/h1-wup-oos-panel
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.33"
      - run: uv sync --locked --extra dev
      - name: Apply Ruff fix and remove helper
        run: |
          uv run --locked --extra dev ruff check . --fix
          rm .github/workflows/h1-oos-lint-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix H1 OOS lint and remove diagnostic helper"
          git push

name: H1 WUP OOS PR B evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Reproduce and verify registered evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          curl --fail --location --retry 3 \
            --output data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            https://population.un.org/wup/assets/Download/Cities/WUP2025-F21-DEGURBA-Cities_Pop.xlsx
          printf '%s  %s\n' \
            '3a96030d87aec6c1c50f658d5321067d6345e1ab936c5d2854524f972caa75c0' \
            'data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx' > /tmp/f21.sha256
          sha256sum --check --strict /tmp/f21.sha256
          rm -rf /tmp/h1_oos_pr_b
          uv run --locked python -m urban_growth.h1_oos build \
            --f21 data/raw/WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            --output-dir /tmp/h1_oos_pr_b \
            --commit e3505aad2f1e2682e3e88b3eb98af6140e59efc8 \
            --repo-root .
          uv run --locked python - <<'PY'
          import csv
          import hashlib
          from pathlib import Path

          registered = {}
          with Path('results/durable_evidence_outputs.csv').open(newline='', encoding='utf-8') as handle:
              for row in csv.DictReader(handle):
                  if row['package_id'] == 'wup-h1-oos-v1':
                      registered[row['repository_path']] = row['sha256']

          checks = [
              (Path('/tmp/h1_oos_pr_b/h1_oos_rows.parquet'), 'results/h1_oos_pr_b/h1_oos_rows.parquet'),
              (Path('/tmp/h1_oos_pr_b/h1_oos_summary.csv'), 'results/h1_oos_pr_b/h1_oos_summary.csv'),
          ]
          for generated, target in checks:
              digest = hashlib.sha256(generated.read_bytes()).hexdigest()
              if digest != registered[target]:
                  raise SystemExit(f'hash mismatch for {target}: {digest}')
          PY

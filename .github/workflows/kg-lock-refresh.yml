name: kg-lock-refresh

on:
  push:
    branches: [feature/knowledge-graph-h1-pilot]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/knowledge-graph-h1-pilot
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.33"
      - name: Refresh lock
        run: uv lock
      - name: Commit lockfile
        run: |
          if git diff --quiet -- uv.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh lockfile for knowledge graph dependencies"
          git push origin HEAD:feature/knowledge-graph-h1-pilot

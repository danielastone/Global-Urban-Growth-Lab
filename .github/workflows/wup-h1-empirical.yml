name: WUP H1 incremental empirical run

on:
  workflow_dispatch:
  push:
    branches:
      - "run/h1-wup-empirical"

permissions:
  contents: read

jobs:
  h1-incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --locked
      - name: Acquire official WUP 2025 city tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          base="https://population.un.org/wup/assets/Download/Cities"
          for file in \
            WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            WUP2025-F25-DEGURBA-Cities_AREA_km2.xlsx \
            WUP2025-F30-DEGURBA-Cities_BU_m2_per_capita.xlsx \
            WUP2025-F34-DEGURBA-Cities_Pop_density.xlsx
          do
            curl --fail --location --retry 3 --retry-delay 2 \
              "$base/$file" --output "data/raw/$file"
          done
          sha256sum data/raw/WUP2025-*.xlsx | tee outputs-wup-source-sha256.txt
      - name: Run corrected-lineage H1 diagnostic
        run: >-
          uv run --locked python scripts/run_wup_h1_incremental.py
          --raw-dir data/raw
          --output outputs/wup_h1_incremental_recent_growth_by_origin.csv
      - name: Print empirical result
        run: cat outputs/wup_h1_incremental_recent_growth_by_origin.csv
      - uses: actions/upload-artifact@v4
        with:
          name: wup-h1-incremental-empirical
          path: |
            outputs/wup_h1_incremental_recent_growth_by_origin.csv
            outputs-wup-source-sha256.txt
          if-no-files-found: error

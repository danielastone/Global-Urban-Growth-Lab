name: World Bank SPI evidence (issue 166)
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/urban_growth/spi_evidence.py','scripts/fetch_spi_166.py','scripts/run_spi_166.py','results/spi_166_source_sha256.txt','.github/workflows/spi-evidence-166.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - run: uv run python scripts/fetch_spi_166.py
      - run: cd data/raw/spi_166 && sha256sum --check --strict ../../../results/spi_166_source_sha256.txt
      - run: uv run python scripts/run_spi_166.py
